[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-relay-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "Django>=5.1,<5.3", "djangorestframework>=3.15,<3.17",
  "djangorestframework-simplejwt>=5.3,<5.6", "django-cors-headers>=4.4,<5",
  "dj-database-url>=2.2,<3", "psycopg[binary]>=3.2,<4",
  "redis>=5.0,<6", "telethon>=1.36,<2", "cryptography>=43,<46",
  "gunicorn>=23,<24", "python-json-logger>=2,<4",
]
[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-django>=4.9,<5", "ruff>=0.7,<1", "mypy>=1.12,<2"]
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
[tool.setuptools.packages.find]
include = ["config*", "relay*"]
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "B"]
