services:
  db:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: relay, POSTGRES_USER: relay, POSTGRES_PASSWORD: relay}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck: {test: [CMD-SHELL, "pg_isready -U relay"], interval: 5s, timeout: 3s, retries: 10}
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes: [redis-data:/data]
  api:
    build: .
    env_file: [.env]
    environment: {DATABASE_URL: postgresql://relay:relay@db:5432/relay, REDIS_URL: redis://redis:6379/0}
    ports: ["8000:8000"]
    depends_on: {db: {condition: service_healthy}}
  worker:
    build: .
    command: [python, manage.py, runtelegramworker]
    env_file: [.env]
    environment: {DATABASE_URL: postgresql://relay:relay@db:5432/relay, REDIS_URL: redis://redis:6379/0}
    depends_on: {db: {condition: service_healthy}}
    restart: unless-stopped
volumes: {postgres-data: {}, redis-data: {}}

