name: backend
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_DB: relay, POSTGRES_USER: relay, POSTGRES_PASSWORD: relay}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U relay" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DEBUG: "true"
      DATABASE_URL: postgresql://relay:relay@localhost:5432/relay
      APP_SECRET_KEY: test-app-secret-that-is-long-enough
      JWT_SECRET_KEY: test-jwt-secret-that-is-at-least-32-bytes
      TELEGRAM_SESSION_ENCRYPTION_KEY: test-encryption-key
      ALLOW_IN_MEMORY_CACHE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e '.[dev]'
      - run: python manage.py migrate --noinput
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest
      - run: ruff check .
      - run: docker build .
