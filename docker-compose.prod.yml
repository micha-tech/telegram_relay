services:
  api:
    build: .
    env_file: [.env]
    restart: unless-stopped
    expose: ["8000"]
    networks: [relay]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live/', timeout=2)"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  worker:
    build: .
    command: [python, manage.py, runtelegramworker]
    env_file: [.env]
    restart: unless-stopped
    networks: [relay]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    depends_on:
      api: {condition: service_healthy}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-relay.example.com}
      CADDY_EMAIL: ${CADDY_EMAIL:-admin@example.com}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [relay]
    depends_on: [api]

networks: {relay: {}}
volumes: {caddy-data: {}, caddy-config: {}}
